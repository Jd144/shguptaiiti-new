<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPBME Lab — IIT Indore</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/public.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animations.css"><script src="js/config.js"></script><script src="js/utils.js"></script><script src="js/data.js"></script><script src="js/state.js"></script><script src="js/toast.js"></script><script src="js/lightbox.js"></script><script src="js/auth.js"></script><script src="js/firebase-db.js"></script><script src="js/cms-core.js"></script><script src="js/cms-teaching.js"></script><script src="js/cms-opportunities.js"></script><script src="js/cms-news.js"></script><script src="js/cms-gallery.js"></script><script src="js/announcements.js"></script><script src="js/theme-editor.js"></script><script src="js/super-admin.js"></script><script src="js/admin-ui.js"></script></head><body x-data="labCMS()" x-init="init()" :style="{backgroundColor:themeColors.background}"><div x-show="showAnnBar&&announcements.length" class="announcement"><div class="marquee" x-text="announcements.map(a=>a.text||a).join('   •   ')"></div></div><nav class="site-nav"><div class="nav-inner"><button class="text-left" @click="navigate('home')"><div class="font-bold text-lg font-poppins" x-text="homeData.labCode||'IIT Indore'"></div><div class="text-xs opacity-80" x-text="homeData.labSubName||'Biophysics & Biomedical Engineering Lab'"></div></button><div class="nav-links"><template x-for="item in menuOrder" :key="item"><button :class="activePage===item.toLowerCase()?'active':''" @click="handleNavClick(item)" x-text="pageNames[item.toLowerCase()]||item"></button></template><button x-show="isLoggedIn" @click="navigate('admin')">Admin</button></div><button class="md:hidden" @click="mobileMenuOpen=!mobileMenuOpen">☰</button></div><div x-show="mobileMenuOpen" class="md:hidden p-3 space-y-1"><template x-for="item in menuOrder" :key="'m'+item"><button class="w-full text-left px-3 py-2 rounded bg-white/10" @click="navigate(item.toLowerCase())" x-text="pageNames[item.toLowerCase()]||item"></button></template><button class="w-full text-left px-3 py-2" @click="navigate(isLoggedIn?'admin':'login-gateway')" x-text="isLoggedIn?'Admin':'Admin Login'"></button></div></nav><main><section x-show="activePage==='home'" class="hero"><div class="container"><h1 x-text="homeData.heroTitle"></h1><p x-text="homeData.heroSubtitle"></p></div></section><div x-show="activePage==='home'" class="container page grid grid-2"><section class="card pi"><img :src="piPhotoSrc()" alt="Principal Investigator"><div><h2 class="section-title" x-text="homeData.piName"></h2><p class="font-semibold mb-3" :style="{color:themeColors.sky}" x-text="homeData.piRole"></p><p class="leading-7 muted" x-text="homeData.piBio"></p></div></section><aside class="card"><h2 class="section-title">News & Updates</h2><template x-for="n in news" :key="n.id"><div class="news-item mb-4"><div class="text-xs muted" x-text="formatDate(n.date)"></div><div class="text-sm mt-1" x-text="n.text"></div></div></template></aside><section class="card"><h2 class="section-title">Lab Gallery</h2><div class="gallery"><template x-for="g in gallery" :key="g.id"><img :src="g.src||g.url" :alt="g.title" @click="openLightbox(g.src||g.url,'image',g.title)"></template></div><div x-show="!gallery.length" class="empty">No gallery items yet.</div></section></div><section x-show="activePage==='research'" class="container page"><h2 class="section-title">Research</h2><div class="grid grid-2"><template x-for="r in (researchAreas||[])" :key="r.id"><article class="card research-item"><h3 class="font-bold text-lg" x-text="r.title"></h3><p class="muted mt-2" x-text="r.desc"></p></article></template></div></section><section x-show="activePage==='people'" class="container page"><h2 class="section-title text-center" x-text="pageNames.people"></h2><div class="flex flex-wrap gap-2 justify-center mb-8"><button class="pill" @click="peopleFilter='All'">All</button><template x-for="c in teamCategories" :key="c"><button class="pill" @click="peopleFilter=c" x-text="c"></button></template></div><div class="grid grid-3"><template x-for="p in team.filter(x=>peopleFilter==='All'||x.category===peopleFilter)" :key="p.id"><article class="card team-card"><img class="team-photo" :src="p.photo||p.img||APP_CONFIG.defaultPiImage"><div class="text-center"><h3 class="font-bold mt-3" x-text="p.name"></h3><p class="muted text-sm" x-text="p.role"></p><p class="text-xs mt-3" x-text="p.researchArea"></p></div></article></template></div></section><section x-show="activePage==='publications'" class="container page"><h2 class="section-title">Publications & Patents</h2><div class="flex gap-2 mb-5"><button class="pill" @click="publicationTab='publications'">Publications</button><button class="pill" @click="publicationTab='patents'">Patents</button></div><input class="input mb-5" x-model="pubSearch" placeholder="Search…"><div x-show="publicationTab==='publications'" class="grid grid-2"><template x-for="p in filteredPublications" :key="p.id"><article class="card"><div class="text-xs muted" x-text="p.year"></div><h3 class="font-bold mt-2" x-text="p.title"></h3><p class="text-sm mt-2" x-text="p.authors"></p><p class="text-xs muted mt-1" x-text="p.journal"></p><a x-show="p.doi" class="text-sm font-bold text-blue-700 mt-3 inline-block" :href="doiUrl(p.doi)" target="_blank">View DOI →</a></article></template></div><div x-show="publicationTab==='patents'" class="grid grid-2"><template x-for="p in filteredPatents" :key="p.id"><article class="card"><div class="text-xs muted" x-text="p.year"></div><h3 class="font-bold mt-2" x-text="p.title"></h3><p class="text-sm mt-2" x-text="p.inventors"></p><span class="pill mt-3" x-text="p.status"></span></article></template></div></section><section x-show="activePage==='teaching'" class="container page"><h2 class="section-title">Teaching</h2><template x-for="c in teachingCategories" :key="c"><div class="card mb-5"><h3 class="font-bold text-xl" x-text="c"></h3><ul class="mt-3 space-y-2"><template x-for="course in teachingByCategory(c)" :key="course.id"><li class="text-sm" x-text="course.title"></li></template></ul></div></template></section><section x-show="activePage==='opportunities'" class="container page"><h2 class="section-title">Opportunities</h2><div class="grid grid-2"><template x-for="o in opportunities" :key="o.id"><article class="card"><span class="pill" x-text="o.status"></span><h3 class="font-bold text-lg mt-3" x-text="o.title"></h3><p class="muted text-sm mt-2" x-text="o.description"></p><p class="text-xs mt-3" x-text="'Deadline: '+o.deadline"></p></article></template></div></section><section x-show="activePage==='contact'" class="container page grid grid-2"><div class="card"><h2 class="section-title">Contact</h2><p>Prof. Sharad Gupta, Ph.D.</p><p>Indian Institute of Technology Indore</p><p>Khandwa Road, Simrol, Indore, Madhya Pradesh, 453252</p><p class="mt-3"><a href="mailto:shgupta@iiti.ac.in">shgupta@iiti.ac.in</a></p></div><div class="card"><iframe title="IIT Indore Map" class="w-full h-80 rounded-xl" src="https://www.google.com/maps?q=Indian%20Institute%20of%20Technology%20Indore&output=embed" loading="lazy"></iframe></div></section><section x-show="activePage==='login-gateway'" class="container page"><div class="modal mx-auto"><h2 class="section-title">Admin Login</h2><form @submit.prevent="login()" class="space-y-3"><input class="input" type="email" x-model="loginEmail" placeholder="Email" required><input class="input" type="password" x-model="loginPassword" placeholder="Password" required><button class="btn w-full">Sign in</button></form></div></section><section x-show="activePage==='admin'" class="container page"><template x-if="!isLoggedIn"><div class="empty">Unauthorized. <button class="btn" @click="navigate('login-gateway')">Login</button></div></template><template x-if="isLoggedIn"><div class="admin-shell"><aside class="sidebar"><h2 class="font-bold text-lg mb-5">BPBME CMS</h2><template x-for="tab in ['dashboard','team','publications','patents','teaching','opportunities','news','gallery','theme','builder']" :key="tab"><button :class="adminSubTab===tab?'active':''" @click="setAdminTab(tab)" x-text="tab.replace('-',' ')"></button></template><button class="mt-5" @click="logout()">Logout</button></aside><div class="admin-main"><div x-show="adminSubTab==='dashboard'" class="grid grid-3"><div class="admin-stat"><b x-text="team.length"></b><br>Team</div><div class="admin-stat"><b x-text="publications.length"></b><br>Publications</div><div class="admin-stat"><b x-text="opportunities.length"></b><br>Opportunities</div></div><div x-show="adminSubTab==='team'" class="admin-section"><h2 class="section-title">Team</h2><button class="btn mb-4" @click="showMemberForm=true;editingMemberId=null;memberForm={name:'',role:'',category:'PhD Scholars',email:'',googleScholar:'',affiliation:'',duration:'',researchArea:'',photo:'',bio:''}">Add Member</button><div x-show="showMemberForm" class="space-y-2 mb-5"><input class="input" x-model="memberForm.name" placeholder="Name"><input class="input" x-model="memberForm.role" placeholder="Role"><input class="input" x-model="memberForm.category" placeholder="Category"><input class="input" x-model="memberForm.researchArea" placeholder="Research area"><button class="btn" @click="editingMemberId?saveMember():addMember();showMemberForm=false">Save</button></div><div class="table-wrap"><table class="table"><template x-for="p in team" :key="p.id"><tr><td x-text="p.name"></td><td x-text="p.role"></td><td x-text="p.category"></td><td><button class="danger" @click="removeMember(p.id)">Delete</button></td></tr></template></table></div></div><div x-show="adminSubTab==='publications'" class="admin-section"><h2 class="section-title">Publications</h2><button class="btn" @click="showPubForm=true;editingPubId=null">Add Publication</button><div x-show="showPubForm" class="space-y-2 my-4"><input class="input" x-model="pubForm.title" placeholder="Title"><input class="input" x-model="pubForm.authors" placeholder="Authors"><input class="input" x-model="pubForm.journal" placeholder="Journal"><input class="input" x-model="pubForm.year" placeholder="Year"><input class="input" x-model="pubForm.doi" placeholder="DOI"><button class="btn" @click="editingPubId?savePublication():addPublication()">Save</button></div><template x-for="p in publications" :key="p.id"><div class="divider"><b x-text="p.title"></b><button class="danger float-right" @click="removePublication(p.id)">Delete</button></div></template></div><div x-show="adminSubTab==='news'" class="admin-section"><h2 class="section-title">News</h2><input class="input mb-2" x-model="newsForm.text" placeholder="News text"><button class="btn" @click="addNews()">Add News</button><template x-for="n in news" :key="n.id"><div class="divider" x-text="n.text"></div></template></div><div x-show="adminSubTab==='theme'" class="admin-section"><h2 class="section-title">Theme</h2><label>Primary</label><input type="color" x-model="themeColors.navy"><label class="ml-5">Accent</label><input type="color" x-model="themeColors.sky"><button class="btn ml-4" @click="saveAll()">Save</button></div><div x-show="adminSubTab==='builder'" class="admin-section"><h2 class="section-title">Super Admin Builder</h2><input class="input mb-2" type="password" x-model="builderPassword" placeholder="Builder password"><button class="btn" @click="unlockBuilder()">Unlock</button><div x-show="!builderLocked" class="mt-4"><input class="input mb-2" x-model="builderPageTitle" placeholder="Page title"><textarea class="input mb-2" x-model="builderContent" placeholder="Content"></textarea><button class="btn" @click="createPage();builderLocked=true">Create Page</button></div></div></div></div></template></section></main><footer class="footer"><div class="container flex justify-between gap-5 flex-wrap"><div><b x-text="siteSettings.footerLabTitle"></b><div class="text-sm opacity-80" x-text="siteSettings.footerLabSubtitle"></div></div><div class="text-sm" x-text="siteSettings.footerCopyrightText"></div></div></footer><div id="toast" class="toast" x-cloak><span id="toast-msg">Done</span></div><div x-show="lightbox.open" class="lightbox" @click="closeLightbox()"><img :src="lightbox.src" :alt="lightbox.title"></div><script src="js/app.js"></script></body></html>
